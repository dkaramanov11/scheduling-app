spring.application.name=backend

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scheduling_db}
spring.datasource.username=${DB_USERNAME:scheduling_user}
spring.datasource.password=${DB_PASSWORD:scheduling_local}

# Hibernate checks the schema; Flyway manages changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true

# Gemini credentials are supplied through environment variables.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:}

# Limits for outgoing AI requests.
app.ai.gemini.connect-timeout-seconds=5
app.ai.gemini.request-timeout-seconds=30

# Global limits per running backend instance.
app.ai.gemini.max-requests-per-minute=5
app.ai.gemini.max-requests-per-day=20