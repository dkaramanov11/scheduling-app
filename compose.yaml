services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: scheduling_db
      POSTGRES_USER: scheduling_user
      POSTGRES_PASSWORD: scheduling_local
    volumes:
      - scheduling_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduling_user -d scheduling_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scheduling_postgres_data: